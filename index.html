<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResourceHub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --text: #1a1a18;
      --muted: #9a9990;
      --border: #e2e0db;
      --accent: #1a1a18;
      --hover-bg: #eeecea;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* Header */
    header {
      padding: 72px 0 56px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .header-stats {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    #file-count {
      color: var(--text);
    }

    /* Search */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .search-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      text-align: right;
      width: 180px;
    }
    .search-input::placeholder { color: var(--muted); }

    /* File list */
    #files-list { display: flex; flex-direction: column; }

    .file-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 4px;
      border-bottom: 1px solid var(--border);
    }

    .file-card:hover {
      background: var(--hover-bg);
    }

    .file-ext {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      width: 32px;
      flex-shrink: 0;
      text-align: right;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-download {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: color .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-download:hover {
      color: var(--text);
    }

    /* States */
    .state-msg {
      padding: 80px 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-align: center;
    }

    .spin {
      display: inline-block;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer {
      padding: 48px 0 32px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer a:hover { color: var(--text); }

    @media (max-width: 480px) {
      header { flex-direction: column; gap: 8px; padding: 48px 0 40px; }
      .toolbar { flex-direction: column; align-items: flex-start; gap: 12px; }
      .search-input { text-align: left; width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <div class="logo">ResourceHub</div>
    <div class="header-stats">
      <span id="file-count"><span class="spin">⟳</span></span> файлов
    </div>
  </header>

  <div class="toolbar">
    <div class="section-label">Файлы</div>
    <input class="search-input" type="text" id="search" placeholder="поиск" oninput="filterFiles()" />
  </div>

  <div id="files-list">
    <div class="state-msg"><span class="spin">⟳</span> загружаю…</div>
  </div>

  <footer>
    <a href="https://docs.github.com/en/rest" target="_blank">GitHub API</a>
  </footer>

</div>

<script>
  const OWNER  = 'edvvord';
  const REPO   = 'upload';
  const FOLDER = 'uploads';

  let allFiles = [];

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function fileExt(name) {
    const parts = name.split('.');
    return parts.length > 1 ? parts.pop().toLowerCase() : '—';
  }

  function renderFiles(files) {
    const el = document.getElementById('files-list');
    if (!files.length) {
      el.innerHTML = '<div class="state-msg">ничего не найдено</div>';
      return;
    }
    el.innerHTML = files.map(f => `
      <div class="file-card">
        <div class="file-ext">${fileExt(f.name)}</div>
        <div class="file-info">
          <div class="file-name">${f.name}</div>
          <div class="file-size">${formatSize(f.size)}</div>
        </div>
        <a class="btn-download" href="${f.download_url}" download="${f.name}" target="_blank">скачать ↓</a>
      </div>
    `).join('');
  }

  function filterFiles() {
    const q = document.getElementById('search').value.toLowerCase();
    renderFiles(allFiles.filter(f => f.name.toLowerCase().includes(q)));
  }

  async function loadFiles() {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;
    try {
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error();
      const data = await res.json();
      allFiles = Array.isArray(data) ? data.filter(f => f.type === 'file') : [];
      document.getElementById('file-count').textContent = allFiles.length;
      renderFiles(allFiles);
    } catch {
      document.getElementById('file-count').textContent = '—';
      document.getElementById('files-list').innerHTML =
        '<div class="state-msg">не удалось загрузить файлы</div>';
    }
  }

  loadFiles();
</script>
</body>
</html>
