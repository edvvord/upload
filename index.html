<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResourceHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7fff72;
      --accent2: #72d4ff;
      --text: #e8e8f0;
      --muted: #5a5a78;
      --danger: #ff6b6b;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(127,255,114,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127,255,114,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 48px 0 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .logo { display: flex; flex-direction: column; gap: 4px; }

    .logo-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo-name {
      font-family: var(--sans);
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-stats {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    #file-count {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--sans);
      display: block;
    }

    /* Search */
    .files-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .search-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      width: 220px;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    /* Files */
    #files-list { display: grid; gap: 8px; }

    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color .2s, transform .15s;
    }

    .file-card:hover {
      border-color: rgba(127,255,114,.3);
      transform: translateX(3px);
    }

    .file-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(127,255,114,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-weight: 600;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .file-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 12px;
    }

    .btn-download {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      color: var(--accent2);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-download:hover {
      background: rgba(114,212,255,.1);
      border-color: var(--accent2);
    }

    .state-msg {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
    }

    .state-msg .big { font-size: 40px; margin-bottom: 12px; display: block; }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 48px;
    }

    footer a { color: var(--accent); text-decoration: none; }

    .spin {
      display: inline-block;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .files-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .search-input { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <div class="logo">
      <span class="logo-tag">// resource hub</span>
      <span class="logo-name">ResourceHub</span>
    </div>
    <div class="header-stats">
      <span id="file-count"><span class="spin">⟳</span></span>
      файлов в репозитории
    </div>
  </header>

  <div class="files-header">
    <div class="section-label">// Файлы</div>
    <input class="search-input" type="text" id="search" placeholder="🔍 поиск..." oninput="filterFiles()" />
  </div>

  <div id="files-list">
    <div class="state-msg">
      <span class="big spin" style="display:inline-block">⟳</span><br>
      Загружаю файлы…
    </div>
  </div>

  <footer>
    ResourceHub — работает на <a href="https://docs.github.com/en/rest" target="_blank">GitHub API</a>
  </footer>

</div>

<script>
  const OWNER  = 'edvvord';
  const REPO   = 'upload';
  const FOLDER = 'uploads';

  let allFiles = [];

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function fileEmoji(name) {
    const ext = name.split('.').pop().toLowerCase();
    const map = {
      pdf: '📄', png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', webp: '🖼',
      zip: '📦', rar: '📦', gz: '📦', '7z': '📦',
      mp4: '🎬', mov: '🎬', avi: '🎬', mkv: '🎬',
      mp3: '🎵', wav: '🎵', flac: '🎵',
      js: '⚡', ts: '⚡', jsx: '⚡', tsx: '⚡',
      py: '🐍', rb: '💎', go: '🐹', rs: '🦀',
      html: '🌐', css: '🎨', json: '📋', xml: '📋', yaml: '📋', yml: '📋',
      md: '📝', txt: '📝', doc: '📝', docx: '📝',
      xls: '📊', xlsx: '📊', csv: '📊',
    };
    return map[ext] || '📁';
  }

  function renderFiles(files) {
    const el = document.getElementById('files-list');
    if (!files.length) {
      el.innerHTML = '<div class="state-msg"><span class="big">📭</span>Файлы не найдены</div>';
      return;
    }
    el.innerHTML = files.map(f => `
      <div class="file-card">
        <div class="file-icon">${fileEmoji(f.name)}</div>
        <div class="file-info">
          <div class="file-name">${f.name}</div>
          <div class="file-meta">
            <span>${formatSize(f.size)}</span>
          </div>
        </div>
        <a class="btn-download" href="${f.download_url}" download="${f.name}" target="_blank">
          ⬇ Скачать
        </a>
      </div>
    `).join('');
  }

  function filterFiles() {
    const q = document.getElementById('search').value.toLowerCase();
    renderFiles(allFiles.filter(f => f.name.toLowerCase().includes(q)));
  }

  async function loadFiles() {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;
    try {
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const data = await res.json();
      allFiles = Array.isArray(data) ? data.filter(f => f.type === 'file') : [];
      document.getElementById('file-count').textContent = allFiles.length;
      renderFiles(allFiles);
    } catch (e) {
      document.getElementById('file-count').textContent = '—';
      document.getElementById('files-list').innerHTML =
        '<div class="state-msg"><span class="big">⚠️</span>Не удалось загрузить файлы.<br>Убедись что репозиторий публичный.</div>';
    }
  }

  loadFiles();
</script>
</body>
</html>
